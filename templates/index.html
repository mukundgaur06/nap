<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, textarea, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .auth-box { display: flex; gap: 20px; margin-bottom: 20px; }
        .auth-box form { flex: 1; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .note { background: #f9f9f9; padding: 15px; border-left: 4px solid #007bff; border-radius: 4px; margin-bottom: 10px; position: relative; }
        .delete-btn { position: absolute; top: 10px; right: 10px; background: #dc3545; padding: 5px 10px; font-size: 12px; }
        .delete-btn:hover { background: #c82333; }
        .logout-btn { background: #6c757d; text-decoration: none; color: white; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
        .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        {% if not user %}
            <h1>Welcome to Notes App</h1>
            {% if auth_error %}
                <div class="error">{{ auth_error }}</div>
            {% endif %}
            <div class="auth-box">
                <form action="/login" method="POST">
                    <h2>Login</h2>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <form action="/register" method="POST">
                    <h2>Register</h2>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Register</button>
                </form>
            </div>
        {% else %}
            <div class="header-bar">
                <h1>Logged in as: {{ user.email }}</h1>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
            
            <form action="/add" method="POST">
                <input type="text" name="title" placeholder="Title" required>
                <textarea name="content" placeholder="Write a note..." rows="3" required></textarea>
                <button type="submit">Add Note</button>
            </form>
            
            <div>
                {% for note in notes %}
                    <div class="note">
                        <h3>{{ note.title }}</h3>
                        <p>{{ note.content }}</p>
                        <form action="/delete/{{ note.id }}" method="POST" style="margin:0;">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
